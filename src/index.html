<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mdeditor — Markdown 편집기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --panel: #27293d; --text: #cdd6f4;
    --accent: #89b4fa; --border: #45475a; --muted: #6c7086;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; color: var(--accent); margin-right: 8px; white-space: nowrap; }
  select, button, input {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #11111b; font-weight: 600; }
  .header-info { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
  #stats { white-space: nowrap; }
  #status { white-space: nowrap; }
  main { flex: 1; display: flex; overflow: hidden; }
  .pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .pane-label {
    font-size: 11px; color: var(--muted); padding: 6px 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #editor {
    flex: 1; width: 100%; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--text);
    font-family: "Consolas", "D2Coding", monospace; font-size: 14px;
    line-height: 1.6; padding: 16px;
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    background: #181825; line-height: 1.7;
  }
  #preview h1,#preview h2,#preview h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 16px 0 10px; }
  #preview p { margin: 10px 0; }
  #preview code { background: #313244; padding: 2px 6px; border-radius: 4px; font-family: "Consolas", monospace; font-size: 0.9em; }
  #preview pre { background: #11111b; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote { border-left: 4px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 12px 0; }
  #preview ul,#preview ol { padding-left: 26px; margin: 10px 0; }
  #preview li.task-list-item { list-style-type: none; margin-left: -18px; }
  #preview input[type="checkbox"] { margin-right: 6px; vertical-align: middle; accent-color: var(--accent); cursor: default; }
  #preview del { color: var(--muted); text-decoration: line-through; }
  #preview a { color: var(--accent); }
  #preview img { max-width: 100%; }
  #preview li > ul, #preview li > ol { margin: 4px 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  #preview table { border-collapse: collapse; margin: 14px 0; width: auto; max-width: 100%; overflow-x: auto; display: block; }
  #preview table thead { background: var(--panel); }
  #preview table th, #preview table td { border: 1px solid var(--border); padding: 7px 14px; }
  #preview table th { color: var(--accent); font-weight: 600; }
  #preview table tbody tr:nth-child(even) { background: #1c1c2b; }
  .divider { width: 1px; background: var(--border); }

  @media (max-width: 768px) {
    main { flex-direction: column; }
    .divider { width: 100%; height: 1px; }
    header { flex-wrap: wrap; }
    .header-info { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
<header>
  <h1>📝 mdeditor</h1>
  <select id="fileList" title="파일 선택"><option value="">— 파일 선택 —</option></select>
  <button id="btnNew">새 파일</button>
  <button id="btnSave" class="primary">저장 (Ctrl+S)</button>
  <div class="header-info">
    <span id="stats">0자 | 1줄</span>
    <span id="status">준비됨</span>
  </div>
</header>
<main>
  <div class="pane">
    <div class="pane-label">편집 (Markdown)</div>
    <textarea id="editor" spellcheck="false" placeholder="# 여기에 마크다운을 입력하세요&#10;&#10;**굵게**, *기울임*, ~~취소선~~, `코드`, [링크](https://example.com)&#10;&#10;- [ ] 할 일 체크박스&#10;- 목록 항목&#10;> 인용문"></textarea>
  </div>
  <div class="divider"></div>
  <div class="pane">
    <div class="pane-label">미리보기</div>
    <div id="preview"></div>
  </div>
</main>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const fileList = document.getElementById('fileList');
const statusEl = document.getElementById('status');
const statsEl = document.getElementById('stats');
let currentFile = '';
let renderTimer = null;
let renderSeq = 0;      // 응답 순서가 뒤바뀌어도 최신 요청 결과만 반영
let dirty = false;      // 저장하지 않은 변경 여부
let isExternalDrop = false; // 외부 폴더에서 드롭된 파일 여부
let isSyncingLeft = false;
let isSyncingRight = false;

function setStatus(msg) { statusEl.textContent = msg; }

function updateStats() {
  const text = editor.value;
  const chars = text.length;
  const lines = text ? text.split('\n').length : 1;
  statsEl.textContent = `${chars.toLocaleString()}자 | ${lines.toLocaleString()}줄`;
}

// 스크롤 동기화
editor.addEventListener('scroll', () => {
  if (isSyncingLeft) { isSyncingLeft = false; return; }
  isSyncingRight = true;
  const maxLeft = editor.scrollHeight - editor.clientHeight;
  const maxRight = preview.scrollHeight - preview.clientHeight;
  if (maxLeft > 0 && maxRight > 0) {
    const ratio = editor.scrollTop / maxLeft;
    preview.scrollTop = ratio * maxRight;
  }
});

preview.addEventListener('scroll', () => {
  if (isSyncingRight) { isSyncingRight = false; return; }
  isSyncingLeft = true;
  const maxLeft = editor.scrollHeight - editor.clientHeight;
  const maxRight = preview.scrollHeight - preview.clientHeight;
  if (maxLeft > 0 && maxRight > 0) {
    const ratio = preview.scrollTop / maxRight;
    editor.scrollTop = ratio * maxLeft;
  }
});

// 서버 오류 메시지 추출 (JSON {"error":...} 또는 상태코드)
async function errorOf(res) {
  const d = await res.json().catch(() => ({}));
  return d.error || res.status;
}

// 파일 이름 정규화: .md / .markdown 이 아니면 .md 를 붙인다
function normName(n) {
  n = n.trim();
  return /\.(md|markdown)$/i.test(n) ? n : n + '.md';
}
function hasFile(name) {
  return [...fileList.options].some(o => o.value.toLowerCase() === name.toLowerCase());
}
function confirmDiscard() {
  return !dirty || confirm('저장하지 않은 변경이 있습니다. 버리고 계속할까요?');
}

// 미리보기 렌더링 (디바운스)
async function render() {
  const seq = ++renderSeq;
  try {
    const res = await fetch('/api/render', { method: 'POST', body: editor.value });
    const data = await res.json();
    if (seq !== renderSeq) return;
    if (!res.ok) { setStatus('렌더 오류: ' + (data.error || res.status)); return; }
    preview.innerHTML = data.html;
  } catch (e) { setStatus('렌더 오류: ' + e); }
}
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 150);
  setStatus('편집 중…');
}
editor.addEventListener('input', () => {
  dirty = true;
  updateStats();
  scheduleRender();
});

// 저장하지 않은 채 창을 닫으려 하면 경고
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// 외부 .md 파일 드래그 앤 드롭 지원
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer && e.dataTransfer.files[0];
  if (file && (file.name.toLowerCase().endsWith('.md') || file.name.toLowerCase().endsWith('.markdown'))) {
    if (!confirmDiscard()) return;
    if (hasFile(file.name)) {
      if (!confirm(`작업 폴더에 '${file.name}' 파일이 이미 존재합니다.\n외부 파일 내용으로 가져오시겠습니까? (저장하기 전까지 기존 작업 폴더의 파일은 유지됩니다)`)) {
        return;
      }
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      editor.value = ev.target.result;
      currentFile = file.name;
      isExternalDrop = true;
      dirty = true;
      updateStats();
      render();
      setStatus('외부 파일 가져옴: ' + file.name + ' (Ctrl+S 로 작업 폴더에 저장)');
    };
    reader.readAsText(file);
  }
});

// 파일 목록 불러오기
async function loadFileList() {
  try {
    const res = await fetch('/api/list');
    const data = await res.json();
    fileList.innerHTML = '<option value="">— 파일 선택 —</option>';
    data.files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f; opt.textContent = f;
      fileList.appendChild(opt);
    });
    fileList.value = currentFile;
  } catch (e) { setStatus('목록 불러오기 실패: ' + e); }
}

// 특정 파일 열기 (드롭다운 / 프로그램 연결 / 쿼리파라미터 공용). 실패 시 현재 편집 내용은 그대로 둔다.
async function openFile(file) {
  if (!file) return false;
  try {
    const res = await fetch('/api/load?file=' + encodeURIComponent(file));
    if (!res.ok) {
      setStatus('불러오기 실패: ' + file + ' — ' + await errorOf(res));
      fileList.value = currentFile;
      return false;
    }
    const data = await res.json();
    editor.value = data.content;
    currentFile = file;
    isExternalDrop = false;
    dirty = false;
    fileList.value = file;
    updateStats();
    render();
    setStatus('열림: ' + file);
    return true;
  } catch (e) {
    setStatus('불러오기 실패: ' + e);
    fileList.value = currentFile;
    return false;
  }
}

fileList.addEventListener('change', () => {
  const file = fileList.value;
  if (!file) { fileList.value = currentFile; return; }
  if (!confirmDiscard()) { fileList.value = currentFile; return; }
  openFile(file);
});

// 새 파일: 이미 있는 이름이면 덮어쓰지 않고 그 파일을 연다
document.getElementById('btnNew').addEventListener('click', async () => {
  if (!confirmDiscard()) return;
  const name = prompt('새 파일 이름 (.md):', 'untitled.md');
  if (!name || !name.trim()) return;
  const file = normName(name);
  if (hasFile(file)) { setStatus('이미 있는 파일이라 새로 만들지 않고 엽니다'); await openFile(file); return; }
  currentFile = file;
  isExternalDrop = false;
  editor.value = '';
  dirty = false;
  fileList.value = '';
  updateStats();
  render();
  setStatus('새 파일: ' + file + ' (저장하면 생성됩니다)');
});

// 저장
async function save() {
  if (!currentFile) {
    const name = prompt('저장할 파일 이름 (.md):', 'untitled.md');
    if (!name || !name.trim()) return;
    const file = normName(name);
    if (hasFile(file) && !confirm(file + ' 은(는) 이미 있습니다. 덮어쓸까요?')) return;
    currentFile = file;
    isExternalDrop = false;
  } else if (isExternalDrop) {
    if (hasFile(currentFile) && !confirm(`'${currentFile}' 은(는) 작업 폴더에 이미 존재합니다. 덮어쓸까요?`)) return;
  }
  try {
    const res = await fetch('/api/save?file=' + encodeURIComponent(currentFile), {
      method: 'POST', body: editor.value
    });
    if (res.ok) {
      dirty = false;
      isExternalDrop = false;
      setStatus('저장됨: ' + currentFile);
      await loadFileList();
    } else {
      setStatus('저장 실패: ' + await errorOf(res));
    }
  } catch (e) { setStatus('저장 실패: ' + e); }
}
document.getElementById('btnSave').addEventListener('click', save);

// 단축키 (Ctrl+S: 저장, Ctrl+N: 새 파일)
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (e.key.toLowerCase() === 'n') { e.preventDefault(); document.getElementById('btnNew').click(); }
  }
});

// Tab / Shift+Tab 키 들여쓰기/내어쓰기 (단일 커서 및 다중 라인 블록 지원)
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const val = editor.value;

    if (start === end) {
      if (e.shiftKey) {
        // Shift+Tab: 커서 앞 2칸 이내 공백 제거
        if (start > 0) {
          const removeCount = val.slice(Math.max(0, start - 2), start) === '  ' ? 2 : (val[start - 1] === ' ' ? 1 : 0);
          if (removeCount > 0) {
            editor.setRangeText('', start - removeCount, start, 'end');
            editor.dispatchEvent(new Event('input'));
          }
        }
      } else {
        // Tab: 2칸 공백 들여쓰기
        if (!document.execCommand('insertText', false, '  ')) {
          editor.setRangeText('  ', start, end, 'end');
          editor.dispatchEvent(new Event('input'));
        }
      }
    } else {
      // 다중 라인 블록 들여쓰기 / 내어쓰기
      const lineStart = val.lastIndexOf('\n', start - 1) + 1;
      const lineEnd = val.indexOf('\n', end);
      const selEnd = lineEnd === -1 ? val.length : lineEnd;
      const selectedBlock = val.slice(lineStart, selEnd);
      const lines = selectedBlock.split('\n');

      if (e.shiftKey) {
        // 내어쓰기: 각 줄 시작에서 최대 2칸 공백 제거
        const newLines = lines.map(line => {
          if (line.startsWith('  ')) return line.slice(2);
          if (line.startsWith(' ')) return line.slice(1);
          return line;
        });
        const replacement = newLines.join('\n');
        editor.setRangeText(replacement, lineStart, selEnd, 'select');
        editor.dispatchEvent(new Event('input'));
      } else {
        // 들여쓰기: 각 줄 시작에 2칸 공백 추가
        const newLines = lines.map(line => '  ' + line);
        const replacement = newLines.join('\n');
        editor.setRangeText(replacement, lineStart, selEnd, 'select');
        editor.dispatchEvent(new Event('input'));
      }
    }
  }
});

// 초기화
(async function init() {
  await loadFileList();
  const target = new URLSearchParams(window.location.search).get('file');
  if (target && await openFile(target)) return;
  editor.value = '# mdeditor 에 오신 것을 환영합니다\n\n왼쪽에서 **마크다운**을 편집하면 오른쪽에 *실시간* 미리보기가 나타납니다.\n\n- 가볍고 빠른 Rust 서비스\n- 의존성 `제로`\n- ~~취소선~~ 지원\n\n### 할 일 목록 (Task List)\n- [x] mdeditor 실행하기\n- [ ] 마크다운 작성하기\n\n| 기능 | 지원 |\n| --- | :---: |\n| 제목 & 서식 | ✅ |\n| 표 & 체크박스 | ✅ |\n\n> 즐거운 작성 되세요!';
  updateStats();
  render();
})();
</script>
</body>
</html>
