[package]
name = "mdeditor"
version = "0.1.0"
edition = "2021"
description = "A tiny zero-dependency Markdown editor & previewer service in Rust"

[dependencies]
# 의존성 없음 — 표준 라이브러리(std)만 사용하여 최대한 가볍게 구성

[profile.release]
opt-level = "z"     # 바이너리 크기 최소화
lto = true          # Link Time Optimization
codegen-units = 1
panic = "abort"
strip = true        # 심볼 제거로 바이너리 경량화
