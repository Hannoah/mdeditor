[package]
name = "mdeditor"
version = "0.11.1"
edition = "2021"
description = "A native Markdown editor & previewer desktop app in Rust (eframe/egui)"

[dependencies]
# 순수 네이티브 데스크톱 앱(mdeditor) — 브라우저/웹뷰/로컬 서버 없음
egui_extras = { version = "0.37", features = ["image", "file", "svg"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["load-images", "pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.18"
# HTML 내보내기 (egui_commonmark가 이미 쓰는 파서, html 기능만 추가)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Windows·Linux: glow(OpenGL) 렌더러 — wgpu 대비 메모리·바이너리 크기 절반 수준
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "persistence", "default_fonts", "clipboard", "links", "accesskit", "wayland", "x11"] }

# macOS: OpenGL은 폐기 예정 계층을 거치며 창 버퍼(IOSurface)만 ~73MB를 쓴다.
# wgpu Metal 백엔드만 켜면 전체 메모리 122MB → 54MB (빈 창 기준 측정)
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "persistence", "default_fonts", "clipboard", "links", "accesskit"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] } # = wgpu/metal

[[bin]]
name = "mdeditor"
path = "src/main.rs"

[profile.release]
opt-level = 3       # 실행 속도 및 렌더링 성능 최대화
lto = true          # Link Time Optimization
codegen-units = 1
panic = "abort"
strip = true        # 심볼 제거로 바이너리 경량화

# 시작 시·가끔만 쓰는 코드(셰이더 번역·SVG 아이콘·대화상자·링크 URL 등)는 크기 우선으로 컴파일한다.
# 매 프레임 경로(egui·wgpu·글꼴·마크다운 파서·접근성)와 이미지 디코더는 opt-level 3 유지.
# 측정: 실행 파일 -1.0MB(-9%), 시작 시간 차이 없음(측정 편차 안)
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.naga-types]
opt-level = "z"
[profile.release.package.wgpu-naga-bridge]
opt-level = "z"
[profile.release.package.codespan-reporting]
opt-level = "z"
